loss:
  num_subspaces: 16
  subspace_dim: null
  num_slices: 256
  reg_weight: 0.02

pretrain:
  updates: 1536
  batch_size: 24
  lr_enc: 1.0e-4
  lr_pred: 3.0e-4
  rollout_len: 5
  seed: 42
  log_every: 250
  val_ratio: 0.1

finetune:
  ablation: joint
  gamma: 0.997
  lr_enc: 3.0e-5
  lr_pred: 1.0e-4
  lr_head: 3.0e-4
  batch_size: 24
  seed: 42
  log_every: 250
  fill_decisions: 4096
  decisions: 100000
  evaluation_every: 10000
  evaluation_episodes: 5
