loss:
  num_subspaces: 16
  subspace_dim: null
  num_slices: 256
  reg_weight: 0.02

pretrain:
  epochs: 20
  batch_size: 256
  peak_lr: 3.0e-4
  rollout_len: 5
  num_workers: 4
  seed: 42
  log_every: 250
  val_ratio: 0.1
  max_cache_gb: 4.0

bootstrap:
  warmup_epochs: 10
  joint_epochs: 10
  gamma: 0.990
  lr_warmup: 3.0e-4
  lr_enc: 5.0e-6
  lr_val: 1.0e-4
  value_weight: 0.5
  batch_size: 128
  num_workers: 4
  seed: 42
  rollout_len: 5
  log_every: 50
  max_cache_gb: 2.0

policy_sft:
  epochs: 100
  batch_size: 128
  lr_min: 4.0e-6
  lr_max: 4.0e-4
  num_workers: 4
  min_frames: 450
  max_frames: 540
  log_every: 50

finetune:
  joint_epochs: 4
  gamma: 0.990
  lr_enc: 5.0e-6
  lr_val: 1.0e-4
  lr_policy: 3.0e-5
  value_weight: 0.5
  policy_weight: 1.0
  human_anchor_ratio: 0.5
  bootstrap_anchor_ratio: 0.25
  max_advantage_weight: 20.0
  evaluation_episodes: 15
  promotion_min_improvement_frames: 5
  batch_size: 128
  num_workers: 4
  seed: 42
  rollout_len: 5
  log_every: 50
  max_cache_gb: 1.0
