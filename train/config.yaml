  val_ratio: 0.1

finetune:
  ablation: joint
  gamma: 0.997
  lr_enc: 3.0e-5
  lr_pred: 1.0e-4
  lr_head: 3.0e-4
  batch_size: 24
  seed: 42
  log_every: 250
  total_epochs: 20
  exploration_epochs: 2
  drives_per_epoch: 5
  optimizer_attempts_per_epoch: 1000
  evaluation_interval: null
  evaluation_races: 5
