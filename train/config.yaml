loss:
  num_subspaces: 16
  subspace_dim: null
  num_slices: 256
  reg_weight: 0.02

pretrain:
  updates: 1536
  batch_size: 24
  lr_enc: 1.0e-4
  lr_pred: 3.0e-4
  rollout_len: 5
  seed: 42
